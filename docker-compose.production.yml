version: '3.8'

services:
  taiwantea:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taiwantea-app
    restart: unless-stopped
    ports:
      - "7070:7070"
    environment:
      # Database - Using remote MongoDB
      - MONGODB_URL=mongodb://YOUR_USERNAME:YOUR_PASSWORD@YOUR_HOST:2700/taiwantea?authSource=admin
      - DATABASE_NAME=taiwantea

      # Security
      - SECRET_KEY=${SECRET_KEY:-taiwantea-prod-secret-key-change-this-in-production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7

      # CORS - Update with your domain
      - ALLOWED_ORIGINS=http://localhost:7070,http://128.199.112.130:7070

      # File Upload
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=5242880
      - ALLOWED_IMAGE_TYPES=image/jpeg,image/png,image/webp

      # Environment
      - ENVIRONMENT=production

    volumes:
      # Persist uploaded images
      - ./uploads:/app/uploads
      # Persist logs
      - ./logs:/var/log/supervisor

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7070/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

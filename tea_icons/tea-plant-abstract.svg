<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Design 3: Abstract Tea Plant with Three Leaves -->
  <defs>
    <radialGradient id="plantGradient">
      <stop offset="0%" style="stop-color:#5a8c3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5016;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Center stem -->
  <path d="M 50 80 L 50 40"
        stroke="#2d5016" stroke-width="4" stroke-linecap="round"/>

  <!-- Left leaf -->
  <ellipse cx="35" cy="50" rx="15" ry="22"
           fill="url(#plantGradient)" stroke="#1a3d0a" stroke-width="2"
           transform="rotate(-25 35 50)"/>

  <!-- Center leaf (larger) -->
  <ellipse cx="50" cy="30" rx="16" ry="25"
           fill="url(#plantGradient)" stroke="#1a3d0a" stroke-width="2"/>

  <!-- Right leaf -->
  <ellipse cx="65" cy="50" rx="15" ry="22"
           fill="url(#plantGradient)" stroke="#1a3d0a" stroke-width="2"
           transform="rotate(25 65 50)"/>

  <!-- Leaf veins (center) -->
  <line x1="50" y1="18" x2="50" y2="45"
        stroke="#1a3d0a" stroke-width="1" opacity="0.4"/>

  <!-- Leaf veins (left) -->
  <line x1="35" y1="35" x2="35" y2="60"
        stroke="#1a3d0a" stroke-width="0.8" opacity="0.3"
        transform="rotate(-25 35 50)"/>

  <!-- Leaf veins (right) -->
  <line x1="65" y1="35" x2="65" y2="60"
        stroke="#1a3d0a" stroke-width="0.8" opacity="0.3"
        transform="rotate(25 65 50)"/>
</svg>

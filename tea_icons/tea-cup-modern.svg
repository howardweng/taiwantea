<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Design 2: Modern Minimalist Tea Cup -->
  <defs>
    <linearGradient id="cupGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a6625;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5016;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Cup body -->
  <path d="M 30 35 L 25 70 Q 25 78 32 78 L 68 78 Q 75 78 75 70 L 70 35 Z"
        fill="url(#cupGradient)" stroke="#1a3d0a" stroke-width="2.5"/>

  <!-- Tea liquid surface -->
  <ellipse cx="50" cy="35" rx="20" ry="6" fill="#5a8c3a" opacity="0.9"/>

  <!-- Handle -->
  <path d="M 70 40 Q 80 45 80 55 Q 80 62 72 65"
        stroke="#2d5016" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Steam (elegant curves) -->
  <path d="M 38 25 Q 35 18 38 12"
        stroke="#6b9d4a" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 50 22 Q 47 15 50 8"
        stroke="#6b9d4a" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 62 25 Q 65 18 62 12"
        stroke="#6b9d4a" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>

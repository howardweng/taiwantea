<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Design 1: Elegant Tea Leaf -->
  <defs>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a7c2f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5016;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main tea leaf -->
  <path d="M 50 10 Q 65 20 70 35 Q 73 50 70 65 Q 65 80 50 90 Q 35 80 30 65 Q 27 50 30 35 Q 35 20 50 10 Z"
        fill="url(#leafGradient)" stroke="#1a3d0a" stroke-width="2"/>

  <!-- Center vein -->
  <line x1="50" y1="10" x2="50" y2="90" stroke="#1a3d0a" stroke-width="1.5" opacity="0.6"/>

  <!-- Side veins -->
  <path d="M 50 30 Q 58 35 60 40" stroke="#1a3d0a" stroke-width="1" opacity="0.4" fill="none"/>
  <path d="M 50 30 Q 42 35 40 40" stroke="#1a3d0a" stroke-width="1" opacity="0.4" fill="none"/>
  <path d="M 50 50 Q 58 53 62 58" stroke="#1a3d0a" stroke-width="1" opacity="0.4" fill="none"/>
  <path d="M 50 50 Q 42 53 38 58" stroke="#1a3d0a" stroke-width="1" opacity="0.4" fill="none"/>
  <path d="M 50 70 Q 56 73 58 78" stroke="#1a3d0a" stroke-width="1" opacity="0.4" fill="none"/>
  <path d="M 50 70 Q 44 73 42 78" stroke="#1a3d0a" stroke-width="1" opacity="0.4" fill="none"/>
</svg>
